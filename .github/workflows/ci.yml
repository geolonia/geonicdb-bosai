name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/cdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix infra/cdk

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: CDK sample unit tests
        run: npm test --prefix infra/cdk

      - name: CDK sample typecheck
        run: npm run build --prefix infra/cdk

      - name: CDK sample test typecheck
        working-directory: infra/cdk
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Build (static export)
        env:
          # GeonicDB 無しの PR CI 用。本番 deploy-pages では立てない（N-10 fail-closed）。
          BOSAI_USE_SNAPSHOT_FIXTURE: "1"
        run: npm run build

      # ページ重量予算（lighthouserc.js）。閾値の厳格化は issue #6 と共有。
      # build 済みの out/ を使うため lhci を直接呼び、失敗時も指標をログに出す。
      - name: Lighthouse budget
        run: |
          npx lhci autorun
          status=$?
          node scripts/dump-lhr-metrics.mjs
          exit $status
